<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example of attributes in HTML</title>
  </head>
  <body>
    <p title="Dit is een paragraaf">
      Dit is een paragraaf met een title attribute. Als je met de muis over deze
      tekst gaat, zie je de waarde van het title attribute als een tooltip.
    </p>
    <p
      id="intro"
      class="highlight"
      style="color: red"
      title="Dit is een paragraaf"
    >
      Dit is een paragraaf met global attributes.
    </p>
  </body>
</html>
