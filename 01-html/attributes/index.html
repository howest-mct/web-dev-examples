<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example of attributes in HTML</title>
  </head>
  <body>
    <p title="Dit is een paragraaf">
      Dit is een paragraaf met een title attribute. Als je met de muis over deze
      tekst gaat, zie je de waarde van het title attribute als een tooltip.
    </p>
    <p
      id="intro"
      class="highlight"
      style="color: red"
      title="Dit is een paragraaf"
    >
      Dit is een paragraaf met global attributes.
    </p>
    <br />
    <label for="checkbox">Checkbox:</label>
    <input type="checkbox" id="checkbox" checked />
    <br />
    <a href="https://www.example.com">Bezoek onze website</a>
    <br />
    <img
      src="https://mct.be/nieuws/howest-infodagen-2025/howest-infodagen-2025_hu8ae658bae999954de1bdcfa808644db9_88057_400x250_fill_q75_box_smart1.jpeg"
      alt="Beschrijving van de afbeelding"
      title="Tooltip van de afbeelding"
    />
  </body>
</html>
