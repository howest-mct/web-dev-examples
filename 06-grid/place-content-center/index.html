<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>place-content: center</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1 class="title">
        Center multiple items with <code>place-content: center</code>
      </h1>
      <div class="grid">
        <div class="grid__item">1</div>
        <div class="grid__item">2</div>
        <div class="grid__item">3</div>
        <div class="grid__item">4</div>
      </div>
      <p>
        <code>place-content: center</code> is shorthand for
        <code>align-content: center</code> and
        <code>justify-content: center</code>. It centers the whole grid (rows
        and columns) inside the container when there is extra free space.
      </p>
    </main>
  </body>
</html>
