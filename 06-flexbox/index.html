<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: sans-serif;
        font-size: 1.5rem;
      }

      .flex {
        padding: 1rem;
        background-color: gainsboro;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        flex-wrap: wrap;
        align-items: flex-end;
      }

      .flex__item {
        padding: 2rem;
        /* text-align: center; */
        color: white;
      }

      .flex__item--1 {
        background-color: orange;
      }

      .flex__item--2 {
        background-color: orangered;
      }

      .flex__item--3 {
        background-color: red;
      }

      .flex__item--4 {
        background-color: darkred;
      }

      .grid {
        margin-top: 2rem;
        padding: 1rem;
        background-color: lightgray;
        display: grid;
        gap: 1rem;
        grid-template-columns: 400px 400px 200px;
        grid-template-columns: 4rem 5rem auto 5rem 4rem;

        grid-template-columns: repeat(4, 1fr);
        grid-template-areas:
          "header header header header"
          "main main main sidebar"
          "footer footer footer footer";
        /*align-items: center;
        justify-items: center;*/
        /*
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
        grid-template-columns: minmax(260px, 1fr) 1fr 1fr;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        */
        /* grid-template-columns: repeat(2, 1fr 2fr); */
      }

      .grid__item {
        padding: 2rem;
        color: white;
        background-color: blue;
      }

      .grid__item--1 {
        /*grid-column: 1 / -2;
        grid-row: span 3;*/
        grid-area: header;
      }

      .grid__item--2 {
        background-color: darkblue;
        grid-area: main;
        align-self: center;
        justify-self: center;
        /*grid-column: 3 / 5;  */
        /* grid-column: span 10; */
      }

      .grid__item--3 {
        background-color: darkslateblue;
        grid-area: sidebar;
      }
      .grid__item--4 {
        background-color: mediumslateblue;
        grid-area: footer;
      }
    </style>
  </head>

  <body>
    <div class="flex">
      <div class="flex__item flex__item--1">1</div>
      <div class="flex__item flex__item--2">2 iets langer</div>
      <div class="flex__item flex__item--3">3</div>
      <div class="flex__item flex__item--4">4</div>
    </div>

    <div class="grid">
      <div class="grid__item grid__item--1">1</div>
      <div class="grid__item grid__item--2">2 iets langer</div>
      <div class="grid__item grid__item--3">
        3 Lorem ipsum dolor, sit amet consectetur adipisicing elit. Veniam,
        voluptatum cupiditate! Ab ipsum exercitationem minus itaque earum
        officia ullam asperiores harum. Ad reiciendis deserunt exercitationem
        libero maxime praesentium, eveniet quia.
      </div>
      <div class="grid__item grid__item--4">4</div>
      <!-- <div class="grid__item grid__item--4">4</div>
      <div class="grid__item grid__item--1">1</div>
      <div class="grid__item grid__item--2">2</div>
      <div class="grid__item grid__item--3">3</div>
      <div class="grid__item grid__item--4">4</div>
      <div class="grid__item grid__item--1">1</div>
      <div class="grid__item grid__item--2">2</div>
      <div class="grid__item grid__item--3">3</div>
      <div class="grid__item grid__item--4">4</div> -->
    </div>
  </body>
</html>
