<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Gradients Examples</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="container">
      <h1>CSS Gradient Examples</h1>

      <section class="grid">
        <article class="item">
          <div class="swatch linear"></div>
          <strong>Linear Gradient</strong>
          <code>linear-gradient(135deg, ...)</code>
        </article>

        <article class="item">
          <div class="swatch radial"></div>
          <strong>Radial Gradient</strong>
          <code>radial-gradient(circle at 30% 30%, ...)</code>
        </article>

        <article class="item">
          <div class="swatch conic"></div>
          <strong>Conic Gradient</strong>
          <code>conic-gradient(from 45deg, ...)</code>
        </article>

        <article class="item">
          <div class="swatch repeating"></div>
          <strong>Repeating Gradient</strong>
          <code>repeating-linear-gradient(45deg, ...)</code>
        </article>
      </section>
    </main>
  </body>
</html>
