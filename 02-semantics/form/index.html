<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Form voorbeeld</title>
  </head>

  <body>
    <form action="index.html" method="get">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="e.g. John Doe" />
      </div>
      <div>
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="e.g. john.doe@example.com"
        />
      </div>

      <fieldset>
        <legend>Gender</legend>
        <label><input type="radio" name="gender" value="male" /> Male</label>
        <label
          ><input type="radio" name="gender" value="female" /> Female</label
        >
      </fieldset>

      <fieldset>
        <legend>Interests</legend>
        <label
          ><input type="checkbox" name="interest" value="coding" />
          Coding</label
        >
        <label
          ><input type="checkbox" name="interest" value="design" />
          Design</label
        >
      </fieldset>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" cols="33"></textarea>
      </div>
      <div>
        <button type="submit">Send</button>
        <button type="reset">Reset</button>
      </div>
    </form>
  </body>
</html>
