<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position: relative demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <h1>Position: Relative</h1>
      <p class="lead">
        The element is positioned relative to its normal position. The space it
        would have occupied is preserved.
      </p>

      <div class="demo-container">
        <div class="box">1</div>
        <div class="box relative">2 (Relative)</div>
        <div class="box">3</div>
      </div>
    </main>
  </body>
</html>
