<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Self-hosted Webfont: Inter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <h1>Self-hosted Inter</h1>
      <p class="lead">
        This example uses a locally hosted Inter font via @font-face.
      </p>
      <p class="hint">
        Place the file at
        <strong>fonts/Inter-Variable.woff2</strong>
        before opening this page.
      </p>

      <section class="sample">
        <h2>Regular 400</h2>
        <p class="regular">The quick brown fox jumps over the lazy dog.</p>
      </section>

      <section class="sample">
        <h2>Bold 700</h2>
        <p class="bold">The quick brown fox jumps over the lazy dog.</p>
      </section>
    </main>
  </body>
</html>
