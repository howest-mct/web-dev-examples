<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grid-area</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1 class="title"><code>grid-area</code></h1>
      <div class="grid">
        <div class="grid__item header">header</div>
        <div class="grid__item main">main</div>
        <div class="grid__item sidebar">sidebar</div>
        <div class="grid__item footer">footer</div>
      </div>
      <p>
        De layout wordt bepaald met <code>grid-template-areas</code> en elk item
        krijgt zijn positie via <code>grid-area</code>.
      </p>
    </main>
  </body>
</html>
