<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>place-items: center</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1 class="title">
        Center an item with <code>place-items: center</code>
      </h1>
      <div class="grid">
        <div class="grid__item">I am centered!</div>
      </div>
      <p>
        <code>place-items: center</code> is a shorthand for
        <code>align-items: center</code> and <code>justify-items: center</code>.
        It centers the grid item both vertically and horizontally within its
        grid area.
      </p>
    </main>
  </body>
</html>
