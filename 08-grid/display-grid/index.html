<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>display: grid</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1 class="title"><code>display: grid</code></h1>
      <p>
        Contrary to flexbox, grid does not have a default layout direction. By
        default <code>display: grid</code> creates a grid with as many rows and
        as there are child elements.
      </p>
      <div class="grid">
        <div class="grid__item">1</div>
        <div class="grid__item">2 longer content</div>
        <div class="grid__item">3</div>
      </div>
    </main>
  </body>
</html>
